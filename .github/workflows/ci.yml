# ตรวจทุก push และ pull request: ชนิดข้อมูล (TypeScript) -> unit test -> build จริงแบบ production
# ไม่ต้องใช้ MySQL เพราะ unit test ทดสอบเฉพาะตรรกะล้วนใน src/lib และทุกหน้าเป็น dynamic ไม่ต่อฐานข้อมูลตอน build
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
      # ค่าหลอกสำหรับ build เท่านั้น ห้ามใช้ค่านี้กับเครื่องจริง
      JWT_SECRET: ci-only-not-a-real-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@v4

      # ใช้ Node 20 ให้ตรงกับ Dockerfile ที่ใช้รันจริง
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
