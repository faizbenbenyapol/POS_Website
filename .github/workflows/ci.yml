# ตรวจทุก push และ pull request: ชนิดข้อมูล (TypeScript) -> unit test -> build จริงแบบ production
# และ build Docker image ด้วย Dockerfile เดียวกับที่ใช้รันจริง
# ไม่ต้องใช้ MySQL เพราะ unit test ทดสอบเฉพาะตรรกะล้วนใน src/lib และทุกหน้าเป็น dynamic ไม่ต่อฐานข้อมูลตอน build
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # ระบุรุ่นตายตัว ไม่ให้เครื่อง CI เปลี่ยนรุ่นเองโดยไม่รู้ตัว (ubuntu-latest จะย้ายไป Ubuntu 26 ในเดือน ต.ค. 2026)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
      # ค่าหลอกสำหรับ build เท่านั้น ห้ามใช้ค่านี้กับเครื่องจริง
      JWT_SECRET: ci-only-not-a-real-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@v7

      # ใช้ Node 24 ให้ตรงกับ Dockerfile (node:24-alpine) และ engines ใน package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

  # build image จริงทุกครั้ง (ไม่ push ขึ้น registry) กัน Dockerfile พังเงียบ ๆ
  # เช่น เปลี่ยนรุ่น Node แล้ว dependency บางตัว build บน alpine ไม่ผ่าน
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build --tag pos:ci .

      # ตรวจว่า image รันด้วย Node 24 จริง และมีไฟล์ที่ต้องใช้ตอนเริ่มคอนเทนเนอร์ครบ
      - name: Check image contents
        run: |
          docker run --rm --entrypoint node pos:ci --version | grep -E '^v24\.'
          docker run --rm --entrypoint sh pos:ci -c 'test -f server.js && test -f scripts/migrate.js && test -f db/schema.sql && echo ok'
