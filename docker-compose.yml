services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pos_app
    restart: unless-stopped
    ports:
      - '${APP_PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      TZ: Asia/Bangkok
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-pos_user}
      DB_PASSWORD: ${DB_PASSWORD:-pos_secret_password}
      DB_NAME: ${DB_NAME:-pos_qr}
      DB_CONNECTION_LIMIT: ${DB_CONNECTION_LIMIT:-20}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      BUSINESS_DAY_CUTOFF_HOUR: ${BUSINESS_DAY_CUTOFF_HOUR:-4}
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-http://localhost:3000}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-promptpay}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-}
      PAYMENT_ALLOW_SIMULATE: ${PAYMENT_ALLOW_SIMULATE:-0}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - pos_uploads:/app/public/uploads
    networks:
      - pos_network

  db:
    image: mysql:8.0
    container_name: pos_mysql
    restart: unless-stopped
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+07:00
    environment:
      TZ: Asia/Bangkok
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret_password}
      MYSQL_DATABASE: ${DB_NAME:-pos_qr}
      MYSQL_USER: ${DB_USER:-pos_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-pos_secret_password}
    ports:
      - '${DB_HOST_PORT:-3306}:3306'
    volumes:
      - pos_mysql_data:/var/lib/mysql
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-p${DB_ROOT_PASSWORD:-root_secret_password}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - pos_network

volumes:
  pos_mysql_data:
    name: pos_mysql_data
  pos_uploads:
    name: pos_uploads

networks:
  pos_network:
    name: pos_network
    driver: bridge
